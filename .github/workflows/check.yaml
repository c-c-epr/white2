name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.1.2
        with:
          cache: true
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm astro sync
      - parallel:
          - run: pnpm lint
          - run: pnpm format:check
          - run: pnpm build
          - run: pnpm astro check
