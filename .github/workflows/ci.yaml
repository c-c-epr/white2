name: CI
on:
  push:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: pnpm astro sync
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
